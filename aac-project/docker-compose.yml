version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aac-postgres
    environment:
      POSTGRES_USER: aac_user
      POSTGRES_PASSWORD: aac_password
      POSTGRES_DB: aac_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aac_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aac-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: aac-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aac-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aac-backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://aac_user:aac_password@postgres:5432/aac_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CELERY_BROKER=redis://redis:6379/2
      - REDIS_CELERY_BACKEND=redis://redis:6379/3
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aac-network

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aac-worker
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://aac_user:aac_password@postgres:5432/aac_db
      - REDIS_CELERY_BROKER=redis://redis:6379/2
      - REDIS_CELERY_BACKEND=redis://redis:6379/3
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info -Q high,normal,low -c 4
    deploy:
      replicas: 3
    networks:
      - aac-network

  # Celery Beat (Scheduler)
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aac-beat
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://aac_user:aac_password@postgres:5432/aac_db
      - REDIS_CELERY_BROKER=redis://redis:6379/2
      - REDIS_CELERY_BACKEND=redis://redis:6379/3
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    command: celery -A app.workers.celery_app beat --loglevel=info
    networks:
      - aac-network

  # Flower (Celery Monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aac-flower
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A app.workers.celery_app flower --port=5555
    networks:
      - aac-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aac-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    command: npm run dev
    networks:
      - aac-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: aac-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - aac-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: aac-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:3001
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - aac-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aac-nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - aac-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  aac-network:
    driver: bridge
