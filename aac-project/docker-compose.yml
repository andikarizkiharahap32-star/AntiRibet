services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aac_user
      POSTGRES_PASSWORD: aac_password
      POSTGRES_DB: aac_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aac_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aac_user:aac_password@postgres:5432/aac_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_SESSION_URL: ${REDIS_SESSION_URL:-redis://redis:6379/1}
      REDIS_CELERY_BROKER: ${REDIS_CELERY_BROKER:-redis://redis:6379/2}
      REDIS_CELERY_BACKEND: ${REDIS_CELERY_BACKEND:-redis://redis:6379/3}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aac_user:aac_password@postgres:5432/aac_db}
      REDIS_CELERY_BROKER: ${REDIS_CELERY_BROKER:-redis://redis:6379/2}
      REDIS_CELERY_BACKEND: ${REDIS_CELERY_BACKEND:-redis://redis:6379/3}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
    command: celery -A app.workers.celery_app worker --loglevel=info -Q normal,low --pool=solo
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_CELERY_BROKER: ${REDIS_CELERY_BROKER:-redis://redis:6379/2}
      REDIS_CELERY_BACKEND: ${REDIS_CELERY_BACKEND:-redis://redis:6379/3}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_CELERY_BROKER: ${REDIS_CELERY_BROKER:-redis://redis:6379/2}
      REDIS_CELERY_BACKEND: ${REDIS_CELERY_BACKEND:-redis://redis:6379/3}
    command: celery -A app.workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
